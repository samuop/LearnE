<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  body { width: 290px; margin: 0; padding: 14px; font: 13px system-ui, sans-serif; background: #121212; color: #eee; }
  h1 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #e05555; flex: none; }
  .dot.on { background: #1db954; }
  .muted { color: #aaa; }
  #qr { background: #fff; border-radius: 10px; padding: 8px; display: none; margin: 10px auto; width: fit-content; }
  #qr svg { display: block; }
  .url { word-break: break-all; font-family: ui-monospace, monospace; font-size: 11.5px; background: #222; padding: 6px 8px; border-radius: 6px; margin: 6px 0; user-select: all; }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: #aaa; }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; margin: 6px 0; background: #222; color: #eee; border: 1px solid #333; border-radius: 6px; }
  button { background: #fff; color: #111; border: 0; border-radius: 16px; padding: 6px 14px; font-weight: 600; cursor: pointer; }
  ol { padding-left: 18px; margin: 6px 0; } li { margin: 3px 0; }
  code { background: #222; padding: 1px 4px; border-radius: 4px; }
</style>
</head>
<body>
  <h1><span class="dot" id="dot"></span>YT Music Remote</h1>
  <div id="status" class="muted">Buscando el servidor…</div>
  <div id="qr"></div>
  <div id="urls"></div>
  <div id="help" style="display:none">
    <ol>
      <li>Abrí una terminal en la carpeta <code>server</code>.</li>
      <li>Ejecutá <code>node server.js</code> y dejala abierta.</li>
      <li>Volvé a abrir este menú.</li>
    </ol>
  </div>
  <details>
    <summary>Ajustes</summary>
    <label class="muted">Dirección del servidor</label>
    <input id="server" placeholder="http://localhost:8765">
    <button id="save">Guardar</button>
  </details>
  <script src="vendor/qrcode.js"></script>
  <script src="popup.js"></script>
</body>
</html>
